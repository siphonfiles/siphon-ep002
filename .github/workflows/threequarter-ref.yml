name: threequarter-ref (Thomas, second camera angle, one image)

on:
  workflow_dispatch:
    inputs:
      script:
        description: generator script
        default: gen_threequarter_fix.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python "scripts/${{ inputs.script }}"
      - name: Publish to renders branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p out && cp -r out /tmp/pub
          git fetch --depth 1 origin renders
          git switch -c renders FETCH_HEAD
          mkdir -p "refs/threequarter-${GITHUB_RUN_NUMBER}" && cp /tmp/pub/* "refs/threequarter-${GITHUB_RUN_NUMBER}/" || true
          git add refs && git commit -m "threequarter ref ${GITHUB_RUN_NUMBER}" && git push origin HEAD:renders
