name: languagetool check (CPU)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  lt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -q language_tool_python
      - run: python scripts/lt_check.py lt_report.md
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports && cp lt_report.md reports/ep002_languagetool.md
          git add reports && git commit -qm "ep002 LanguageTool report" && (git push || (git pull --rebase && git push))
