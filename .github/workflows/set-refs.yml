name: set-refs (Thomas at the desk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_set_refs.py
      - .github/workflows/set-refs.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/gen_set_refs.py
      - name: Publish to renders branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/pub
          git fetch --depth 1 origin renders || true
          if git rev-parse --verify -q origin/renders; then git switch -c renders origin/renders; else git switch --orphan renders; fi
          mkdir -p "refs/${GITHUB_RUN_NUMBER}" && cp /tmp/pub/* "refs/${GITHUB_RUN_NUMBER}/"
          git add refs && git commit -m "set refs ${GITHUB_RUN_NUMBER}" && git push origin renders
