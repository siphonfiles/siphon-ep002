name: space-api (inspect HF Spaces)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/space_api.py
      - .github/workflows/space-api.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Check token present
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN missing"; exit 1; else echo "HF_TOKEN present (${#HF_TOKEN} chars)"; fi
      - name: Dump APIs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/space_api.py Tongyi-MAI/Z-Image-Turbo Qwen/Qwen-Image-Edit-2511 meituan-longcat/LongCat-Image-Edit anycoderapps/LongCat-Image-Edit
      - name: Publish to renders branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/pub
          git fetch --depth 1 origin renders || true
          if git rev-parse --verify -q origin/renders; then git switch -c renders origin/renders; else git switch --orphan renders; fi
          mkdir -p "api/${GITHUB_RUN_NUMBER}" && cp /tmp/pub/* "api/${GITHUB_RUN_NUMBER}/"
          git add api && git commit -m "space api dump ${GITHUB_RUN_NUMBER}" && git push origin renders
