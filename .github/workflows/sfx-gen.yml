name: sfx gen (Stable Audio Open Small, CPU)
on:
  workflow_dispatch:
    inputs:
      jobs:
        default: sound/ep002/sfx/jobs.json
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet --retries 10 --timeout 120 torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 10 --timeout 120 stable-audio-tools einops
          pip install --quiet --retries 10 --timeout 120 pytorch_lightning torchmetrics k-diffusion alias-free-torch vector-quantize-pytorch x-transformers local-attention ema-pytorch einops-exts safetensors sentencepiece "transformers<5" auraloss encodec descript-audio-codec prefigure
          pip install --quiet --retries 10 --timeout 120 "numpy<2" && pip install --quiet --retries 10 --timeout 120 --force-reinstall --no-deps --no-cache-dir "PyWavelets==1.6.0"
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sfx_gen.py "${{ inputs.jobs }}" sfx_out
      - name: Listening file + mp3s
        run: |
          D=sound/ep002/sfx/candidates; mkdir -p $D; : > list.txt
          ffmpeg -v error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.8 gap.wav
          for f in $(ls sfx_out/*.wav | sort); do
            ffmpeg -v error -y -i $f -codec:a libmp3lame -q:a 3 $D/$(basename ${f%.wav}).mp3
            echo "file '$PWD/$f'" >> list.txt; echo "file '$PWD/gap.wav'" >> list.txt; done
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -codec:a libmp3lame -q:a 3 $D/ALL_in_order.mp3
          ls sfx_out/*.wav | sort | xargs -n1 basename > $D/ORDER.txt; cp sfx_out/log.json $D/
          git config user.name "siphon-bot"; git config user.email "bot@users.noreply.github.com"
          git add $D && git commit -qm "SFX candidates (Stable Audio Open Small, run ${{ github.run_number }})" && git pull -q --rebase && git push -q
