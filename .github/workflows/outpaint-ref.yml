name: outpaint-ref (extend Thomas reference to the right)

# Manual only: uses ZeroGPU quota (~1-2 min). Run after the daily quota has reset.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outpaint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client pillow numpy
      - name: Outpaint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/outpaint_ref.py
      - name: Publish to renders branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/pub
          git fetch --depth 1 origin renders || true
          if git rev-parse --verify -q origin/renders; then git switch -c renders origin/renders; else git switch --orphan renders; fi
          mkdir -p "outpaint/${GITHUB_RUN_NUMBER}" && cp /tmp/pub/* "outpaint/${GITHUB_RUN_NUMBER}/"
          git add outpaint && git commit -m "outpaint ${GITHUB_RUN_NUMBER}" && git push origin renders
