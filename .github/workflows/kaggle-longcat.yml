name: kaggle longcat
# Trimite o rulare LongCat 1.6 pe Kaggle (GPU T4 x2 gratuit, din cota săptămânală Kaggle).
# Nu folosește cota Hugging Face și nu costă bani. Rezultatul se ia cu workflow-ul "kaggle fetch".
on:
  workflow_dispatch:
    inputs:
      job:
        description: fișierul job din kaggle/longcat_t4/
        default: job_ep001_extra.json

env:
  KUSER: ${{ secrets.KAGGLE_USERNAME }}
  DATASET: siphon-longcat-inputs
  KERNEL: siphon-longcat-t4

jobs:
  push:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade "kaggle>=1.8" six
      - name: Dataset with inputs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p ds
          cp kaggle/longcat_t4/${{ inputs.job }} ds/job.json
          cp presenter/reference/thomas_ref_v1_centered_1920x1080.png ds/
          cp kaggle/longcat_t4/inputs/*.wav ds/
          cat > ds/dataset-metadata.json <<J
          {"title": "siphon longcat inputs", "id": "$KUSER/$DATASET", "licenses": [{"name": "other"}]}
          J
          if kaggle datasets status "$KUSER/$DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p ds -m "run ${{ github.run_number }}" -r zip
          else
            kaggle datasets create -p ds -r zip
          fi
          for i in $(seq 1 40); do
            s=$(kaggle datasets status "$KUSER/$DATASET" 2>&1 || true); echo "dataset: $s"
            echo "$s" | grep -qi ready && break; sleep 15
          done
      - name: Push kernel (starts the run)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kn
          cp kaggle/longcat_t4/run.py kn/run.py
          cat > kn/kernel-metadata.json <<J
          {"id": "$KUSER/$KERNEL", "title": "$KERNEL", "code_file": "run.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": ["$KUSER/$DATASET"], "competition_sources": [], "kernel_sources": [],
           "machine_shape": "NvidiaTeslaT4"}
          J
          kaggle kernels push -p kn
          sleep 20
          kaggle kernels status "$KUSER/$KERNEL" || true
